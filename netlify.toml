[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* 변수는 Next.js 규칙상 클라이언트 번들/문서에 노출되는 공개 값이므로
  # Netlify secrets scanner에서 제외 (보안 위험 아님)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_VAPID_PUBLIC_KEY"
